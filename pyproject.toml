[project]
name = "surfclip"
version = "0.1.0"
description = "Find, clip and review rides in phone-filmed standing-wave surf sessions"
readme = "docs/prd.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "torch>=2.5",
    "ultralytics>=8.3",
    "supervision>=0.25",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.12",
    "pyarrow>=18",
    "tomli-w>=1.1",
    "scipy>=1.13",
]

[project.scripts]
surfclip = "surfclip.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surfclip"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/surfclip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs fixture clips in artifacts/fixtures/ (run scripts/make_fixtures.py)",
]
