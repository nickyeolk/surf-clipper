# Surf Session Clipper - default configuration (constitution IX: config, not constants).
# Units: seconds (_s), pool units (_pool, 0-1 across/along the wave), rider heights (_heights),
# fractions of frame size (_frac). Never raw pixels or frame counts, except where a key says
# "_px_at_720p" (a detector-input size, normalised to a 720p frame).
# Bump config_version whenever a default changes (informational). Stage cache keys use only the
# sections each stage reads, so changing a ride threshold never re-runs detection.
config_version = 6

[analysis]
fps = 5                       # analysis proxy frame rate
max_height = 720              # proxy is downscaled to at most this height
tonemap = "hable"             # HDR -> SDR operator for analysis frames

[detect]
model = "artifacts/models/yolo11s.pt"  # downloaded on first use; artifacts/ is gitignored
confidence = 0.2
classes = ["person", "surfboard"]
half_precision = true
batch_size = 16
tiling = "always"             # "off" | "auto" | "always"; T001: 2x2 tiles cost 6.7 min/h and
                              # find ~47% more boxes than full frame at 640 px
tiling_min_height_px_at_720p = 60   # "auto": tile when expected rider height drops below this
imgsz = 640                   # detector input size per tile (or per frame without tiling)
nms_iou = 0.5                 # merge duplicate boxes from overlapping tiles
tile_overlap_frac = 0.2

[track]
max_gap_s = 1.0               # keep a track alive through detection gaps up to this long
min_track_s = 0.6
match_iou = 0.8               # ByteTrack matching threshold
assoc_box_scale = 2.5         # boxes are enlarged this much for matching only: at 5 fps a carving
                              # rider moves ~0.7 box widths per frame and tiny overlaps broke tracks
edge_margin_frac = 0.005      # box within this fraction of the frame size of an edge = touching it
sitting_max_aspect = 0.9      # box height/width below this = sitting or lying
crouched_max_aspect = 1.4     # below this = crouched, above = standing
board_reach_heights = 0.35    # board centre within this many box heights of the feet = on board

[epochs]
match_fps = 1
features = "orb"              # "orb" | "sift"
jump_frac = 0.02              # sudden shift larger than this fraction of frame width
drift_frac = 0.02             # cumulative drift threshold
min_inliers = 150
min_inlier_ratio = 0.35

[zone]
proposal_min_tracks = 3
proposal_min_confidence = 0.5 # below this the UI labels the proposal "unreliable"
try_both_orientations = true
undistort_ultrawide = "auto"  # "off" | "auto"

[rides]
confirm_window_s = 1.5
min_lateral_speed_pool = 0.03 # pool units per second along the wave (path length / time)
evidence_gap_s = 1.5          # brief losses of on-wave evidence (blur, spray, board out of shot)
                              # do not end a ride; close HDR rides lose the board ~half the time
upright_bridge_s = 4.0        # upright in the pool (on the face or against a side wall) without a
                              # visible board keeps a ride going this long (hand on the wall,
                              # 20240924); falls, exits and whitewater still end it
wall_stall_pool = 0.1         # within this of a side wall, any posture counts as still riding
                              # while bridging (stalls against the wall, 20240924)
wall_stall_max_s = 10.0       # holding on at a side wall (crouched/standing/on board) keeps a ride
                              # going this long (20241004: ~5 s holds)
wall_return_max_s = 4.0       # a ride ending at a side wall continues with a track that appears
                              # nearby and rides back out within this long (rider turned there;
                              # 20241004 9:13: a new rider 6.4 s later is a separate ride)
wall_band_in_pool = 0.0      # a side wall's band reaches this far into the pool (0: riders
                              # carve right up to the wall, 20261012)...
wall_band_out_pool = 0.25     # ...and this far beyond it (feet on the wall top project outward)
zone_margin_pool = 0.05       # tolerance around the zone's back and front edges
acid_link_s = 1.0
acid_link_heights = 3.0       # max distance between a side-wall track end and the on-wave start
lesson_overlap_frac = 0.5     # ride flagged "lesson" if others are in the zone this much of it
face_band = "auto"            # "auto": estimate the wave face per session; "off": whole zone
face_low_pct = 5              # face band = these percentiles of confirmed riders' feet depth...
face_high_pct = 98
face_margin_pool = 0.08       # ...widened by this margin
face_min_frames = 200         # fewer confirmed riding frames than this: no band
stitch_gap_s = 1.5           # join track fragments of one person across gaps up to this long
stitch_base_heights = 1.5     # ...when the next fragment starts within this many rider heights
stitch_heights_per_s = 3.0    # ...plus this much per second of gap (riders move fast)
frame_edge_grace_s = 2.0
min_length_s = 10.0           # user-settable before processing
pad_before_s = 1.5            # 1.5/2.0 chosen by scripts/pad_sweep.py (2026-10-15): SC-003 holds
                              # on 20240924 and 20241004 with p95 overhang 2.0 s
pad_after_s = 2.0
refine_window_s = 2.0
changeover_overlap_max_s = 3.0

[analysis_pose]                # 004 ride analysis (named riders only)
fps = 15                      # keypoint rate
model = "artifacts/models/yolo11s-pose.pt"   # s and x agreed closely in the spike (R1)
imgsz = 384                   # pose input size for the rider crop
batch = 16
crop_margin = 0.3             # crop = track box grown by this fraction of its height
min_conf = 0.3                # keypoints below this are not used
smooth_s = 0.3                # Savitzky-Golay window for the compression signal
signal = "leg_torso"          # leg_torso | leg_straightness (R3; chosen on the marks)
turn_speed_pool_per_s = 0.05  # lateral speed (pool units/s) on both sides of a direction change
turn_window_s = 0.7           # a turn's compression minimum within this of the direction change
pump_depth = 0.85             # compression minimum below this (1 = ride median) is a pump/turn
fall_window_s = 1.5           # the end of the ride examined for a fall
fall_depth = 0.6              # compression below this at the end (with no exit) = fall
compare_window_s = [3.0, 0.5] # fall comparison: from end-3 s to end-0.5 s
other_iou_max = 0.3           # crop overlapping another person more than this = unclear

[score]                       # 004 best rides: defaults until the user has starred enough
min_stars = 5                 # starred and unstarred rides needed before fitting to the stars
l2 = 1.0                      # regularisation of the fit (few stars: keep weights small)

[score.weights]               # default weight per standardised feature
length_s = 1.0
clean_end = 1.0
compressions_per_10s = 0.5
depth = 1.0
rhythm = 0.5
tricks = 0.5
unclear = -1.0

[riders]
crops_per_ride = 12           # moments sampled per ride (crops of the ride's tracked person)
keep_sharpest = 8             # ...of which the sharpest are kept
min_crop_height_px = 48       # in review-copy pixels; smaller crops carry too little detail
min_crops = 3                 # fewer usable crops: low evidence, confidence capped
descriptor = "embedding"      # colour | embedding | both; T014 spike: embedding (DINOv2 ViT-S/14)
cluster_threshold = 0.075     # grouping cut (cosine distance of embeddings); T014: best on the
                              # four tuning sessions (PXL held out)
queue_below = 0.5             # rides less confident than this go to the review queue
stills = 6                    # stills shown per rider
join_gap_s = 6.0              # join rides split at a frame edge when the gap is at most this
join_confidence = 0.4         # ...and both halves are at least this confident (portrait: the
                              # 3 true splits are same-card pairs at 0.44-0.66; none other is)
lighting_change_window_s = 30.0  # rides this close to a lighting change get lower confidence

[export]
encoder = "auto"              # "auto" (NVENC, CPU fallback) | "nvenc" | "cpu"
hdr_codec = "hevc_main10"
sdr_codec = "h264_high"
nvenc_preset = "p5"
cq = 19                       # constant-quality target
max_bitrate_factor = 1.5      # cap clip bitrate at this multiple of the source's

[compilation]
caption_s = 3.0               # caption shows for the first seconds of each ride, then is gone
font = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
size_frac = 0.055             # text height as a fraction of the shorter frame side
position = "bottom_left"      # bottom_left | bottom_right | top_left | top_right
margin_frac = 0.04            # of the shorter frame side
box_opacity = 0.45            # black box behind the text
level_sdr = 0.92              # caption grey level (fraction of full scale) per transfer:
level_hlg = 0.75              # HLG reference white (BT.2408), not 1000-nit peak
level_pq = 0.58               # PQ reference white (203 cd/m2)
still_quality = 2             # JPEG quality for stills (ffmpeg -q:v; 2 = best)

[review]
height = 720
keyframe_interval_s = 0.5
max_kbps = 2500               # review copy bitrate cap (~1.1 GB per hour at 720p)
thumb_every_s = 10.0

[server]
host = "127.0.0.1"            # loopback only (FR-025)
port = 8765
source_dirs = [                # folders the browser UI may add videos from (read only)
  "/mnt/c/Users/likkhian/OneDrive/Media/trifecta",
]
